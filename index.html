<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave Planner</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root{
    --bg:#0f172a;
    --card:#111c44;
    --card2:#1e293b;
    --accent:#3b82f6;
    --accent2:#06b6d4;
    --green:#22c55e;
    --red:#ef4444;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:rgba(255,255,255,0.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top left,#1e3a8a 0%,transparent 30%),
        radial-gradient(circle at bottom right,#0f766e 0%,transparent 30%),
        var(--bg);
    color:var(--text);
}

h1{
    text-align:center;
    font-size:32px;
    margin-bottom:20px;
    font-weight:700;
    letter-spacing:0.5px;
}

.container{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.card,
.table-container{
    background:rgba(17,28,68,0.75);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.card h3{
    margin-top:0;
    font-size:18px;
    margin-bottom:12px;
    color:#e2e8f0;
}

input,
select,
button{
    width:100%;
    padding:12px 14px;
    margin-top:10px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.08);
    font-family:'Inter',sans-serif;
    font-size:14px;
}

input,
select{
    background:#0f172a;
    color:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(59,130,246,0.25);
}

button{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:white;
    border:none;
    font-weight:600;
    transition:0.25s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(59,130,246,0.35);
    cursor:pointer;
}

#leaveList{
    max-height:320px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.leaveRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.05);
    padding:10px 12px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.06);
}

.leaveText{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#e2e8f0;
    font-size:13px;
}

.table-container{
    overflow:auto;
}

table{
    border-collapse:separate;
    border-spacing:0;
    width:max-content;
    min-width:100%;
}

th,
td{
    border:1px solid rgba(255,255,255,0.06);
    padding:8px;
    text-align:center;
    font-size:12px;
    min-width:36px;
}

th{
    background:#172554;
    color:white;
    position:sticky;
    top:0;
    z-index:2;
}

td{
    background:rgba(255,255,255,0.02);
}

.nameCell{
    position:sticky;
    left:0;
    background:#111827;
    font-weight:600;
    color:#f8fafc;
    z-index:1;
}

.groupRow td{
    background:linear-gradient(90deg,#2563eb,#0891b2);
    color:white;
    font-weight:700;
    text-align:left;
    padding-left:14px;
    letter-spacing:0.5px;
}

.leave{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    border-color:#16a34a;
}

hr{
    border:none;
    height:1px;
    background:rgba(255,255,255,0.08);
    margin:18px 0;
}

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:20px;
}

@media (min-width:768px){

    .container{
        flex-direction:row;
        align-items:flex-start;
    }

    .card{
        width:300px;
        flex-shrink:0;
    }

    .table-container{
        flex:1;
    }
}

</style>

</head>

<body>

<h1>Leave Planner | HRRL | Offsite Team </h1>

<div class="container">

<div class="card">

<h3>Select Month</h3>
<select id="monthSelect"></select>
<select id="yearSelect"></select>

<hr>

<h3>Apply Leave</h3>

<select id="group"></select>
<select id="employee"></select>

<input type="date" id="start">
<input type="date" id="end">

<button onclick="addLeave()">Submit</button>

</div>

<div class="card">
<h3>Manage Leaves</h3>
<div id="leaveList"></div>
</div>

<div class="table-container">
<table id="leaveTable"></table>
</div>

</div>

<script type="module">

// ===== FIREBASE =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBu5wz6HrytGigtE83CruB128qXspo41wI",
  authDomain: "leave-17e89.firebaseapp.com",
  databaseURL: "https://leave-17e89-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "leave-17e89",
  storageBucket: "leave-17e89.firebasestorage.app",
  messagingSenderId: "36007163692",
  appId: "1:36007163692:web:9c90ec1bffbdf1632f5e89",
  measurementId: "G-N30QLCPF2F"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const leaveCollection = collection(db, "leaves");

// ===== EMPLOYEES =====
const employees = {
    E1: ["Ramprit","Harish","Saketh","Abhay","Kundan","Ajit","Raghav","Jibraan","Yugank","Pavan","Ashutosh","Ayush","Sai"],
    E0: ["Prempal","Suraj Tripathi","Lokesh","Ibran Ali","Chetan","Ajay Pal","Manish","Rahul","Aryan","Sunny","Bhawani Kumar",
         "Karan","Suneet","Mukesh","Hritik","Satish","Rishabh","Sandeep","Rajnish","Manav","Vaibhav","Nisarg","Dharak",
         "Ravendra","Vivek Mishra","Ripoon","Vipul Das","Subhadip","Sudip","Ajit Tiwari","Akhil","Smit","Taksh","Vishal","Nikhil Kr"]
};

// ===== MONTH =====
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

let today = new Date();
let selectedMonth = today.getMonth();
let selectedYear = today.getFullYear();

const monthSelect = document.getElementById("monthSelect");
const yearSelect = document.getElementById("yearSelect");

monthNames.forEach((m,i)=>{
    let opt=document.createElement("option");
    opt.value=i;
    opt.innerText=m;
    if(i===selectedMonth) opt.selected=true;
    monthSelect.appendChild(opt);
});

for(let y=selectedYear-2;y<=selectedYear+2;y++){
    let opt=document.createElement("option");
    opt.value=y;
    opt.innerText=y;
    if(y===selectedYear) opt.selected=true;
    yearSelect.appendChild(opt);
}

monthSelect.onchange=()=>{selectedMonth=+monthSelect.value; renderTable();}
yearSelect.onchange=()=>{selectedYear=+yearSelect.value; renderTable();}

// ===== DROPDOWN =====
const groupSelect=document.getElementById("group");
const empSelect=document.getElementById("employee");

Object.keys(employees).forEach(g=>{
    let opt=document.createElement("option");
    opt.value=g;
    opt.innerText=g;
    groupSelect.appendChild(opt);
});

groupSelect.onchange=updateEmployees;

function updateEmployees(){
    empSelect.innerHTML="";
    employees[groupSelect.value].forEach(e=>{
        let opt=document.createElement("option");
        opt.value=e;
        opt.innerText=e;
        empSelect.appendChild(opt);
    });
}
updateEmployees();

// ===== STATE =====
let leaves = [];

// REALTIME SYNC
onSnapshot(leaveCollection, (snapshot) => {
    leaves = [];
    snapshot.forEach(docSnap => {
        leaves.push({
            id: docSnap.id,
            ...docSnap.data()
        });
    });
    renderTable();
    renderLeaveList();
});

// ===== ADD =====
async function addLeave(){

    const emp=empSelect.value;
    const start=document.getElementById("start").value;
    const end=document.getElementById("end").value;

    if(!emp || !start || !end) return alert("Fill all fields");

    if(start > end) return alert("Invalid dates");

    if(!confirm(`Apply leave for ${emp}?`)) return;

    await addDoc(leaveCollection, { emp, start, end });
}

// ===== DELETE =====
async function deleteLeave(id){
    if(!confirm("Delete leave?")) return;
    await deleteDoc(doc(db, "leaves", id));
}

// ===== LIST =====
function renderLeaveList(){
    const container=document.getElementById("leaveList");
    container.innerHTML="";

    if(leaves.length===0){
        container.innerHTML="<p>No leaves</p>";
        return;
    }

    leaves.forEach(l=>{
        let div=document.createElement("div");

        div.className="leaveRow";

            div.innerHTML=`
                <div class="leaveText">
                    <b>${l.emp}</b><br>
                    ${l.start} → ${l.end}
                </div>
            
                <button class="leaveDelete"
                    onclick="deleteLeave('${l.id}')">
                    ✕
                </button>
            `;

        container.appendChild(div);
    });
}

// ===== TABLE =====
function renderTable(){

    const days=new Date(selectedYear,selectedMonth+1,0).getDate();
    const table=document.getElementById("leaveTable");
    table.innerHTML="";

    let h1="<tr><th>Name</th>";
    let h2="<tr><th></th>";

    for(let d=1;d<=days;d++){
        let dt=new Date(selectedYear,selectedMonth,d);
        h1+=`<th>${d}</th>`;
        h2+=`<th>${dt.toLocaleDateString('en-US',{weekday:'short'})}</th>`;
    }

    table.innerHTML+=h1+"</tr>"+h2+"</tr>";

    Object.keys(employees).forEach(group=>{

        table.innerHTML+=`<tr class="groupRow">
            <td colspan="${days+1}">${group}</td>
        </tr>`;

        employees[group].forEach(emp=>{

            let row=`<tr><td class="nameCell">${emp}</td>`;

            for(let d=1;d<=days;d++){
                
                let dt = new Date(selectedYear, selectedMonth, d);
                let current =
                    dt.getFullYear() + "-" +
                    String(dt.getMonth() + 1).padStart(2, '0') + "-" +
                    String(dt.getDate()).padStart(2, '0');

                let isLeave=false;

                leaves.forEach(l=>{
                    if(l.emp===emp){
                        if(current>=l.start && current<=l.end){
                            isLeave=true;
                        }
                    }
                });

                row+=`<td class="${isLeave ? 'leave':''}"></td>`;
            }

            row+="</tr>";
            table.innerHTML+=row;
        });
    });
}

// 🔥 FIX: expose functions globally
window.addLeave = addLeave;
window.deleteLeave = deleteLeave;

</script>

</body>
</html>
